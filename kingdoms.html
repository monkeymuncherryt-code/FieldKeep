function canAfford(cost){return Object.entries(cost).every(([k,v])=>(s.resources[k]||0)>=v)}

function reward(r){for(const [k,v] of Object.entries(r))if(k==='xp'){s.xp+=v}else if(k in s.resources){s.resources[k]+=v}else if(k in s.vault)s.vault[k]+=v;}

function coinCost(base,level=0){const mult=1+.65*level;return Object.fromEntries(Object.entries(base).map(([k,v])=>[k,Math.round(v*mult)]));}
function gainXP(x){s.xp+=x;s.seasonPoints+=Math.ceil(x/2);const newLevel=1+Math.floor(Math.sqrt(s.xp/100));if(newLevel>s.level){s.level=newLevel;reward({crystal:newLevel*6});note('🌟 Kingdom level '+s.level+'! Bonus crystals added.')} else s.level=newLevel;}

else if(t.kind==='survey'){const radius=2+(s.research.scouting||0)+(s.activeHero==='rowan'?1:0);for(let y=t.y-radius;y<=t.y+radius;y++)for(let x=t.x-radius;x<=t.x+radius;x++)if(x>=0&&y>=0&&x<W&&y<H&&Math.hypot(x-t.x,y-t.y)<=radius&&!s.explored.includes(key(x,y)))s.explored.push(key(x,y));quest('mapper');note('🧭 New territory surveyed!');gainXP(22)}

else if(t.kind==='lane'){s.raidWins++;reward({gold:110,crystal:12,scroll:1});gainXP(45);note('🏆 All frontier lanes held. Rewards collected!')}
else if(t.kind==='rally'){const land=LANDMARKS.find(x=>x.id===t.id);if(land){reward({gold:120,token:2,crystal:10});s.reputation+=8;gainXP(48);note('🤝 Alliance rally completed: '+land.name)}}
 drawingDirty=true}
function tick(){const now=Date.now();if(now-tickAt<800)return;const elapsed=clamp((now-(s.lastTick||now))/1000,0,7200);tickAt=now;s.lastTick=now;
 const researchBonus=(k)=>1+.15*(s.research[k]||0);
 const rates={food:1.0*s.buildings.farm*researchBonus('harvest'),wood:.75*s.buildings.lumber*researchBonus('forestry'),stone:.48*s.buildings.quarry*researchBonus('masonry'),gold:.42*s.buildings.market*(1+.12*(s.research.commerce||0))};
 if(s.activePet==='sprite'){rates.food*=1.1;rates.wood*=1.1}
 for(const [k,v] of Object.entries(rates))s.resources[k]=Math.round((s.resources[k]+v*elapsed)*10)/10;
 const done=s.tasks.filter(t=>t.end<=now);s.tasks=s.tasks.filter(t=>t.end>now);done.forEach(finishTask);

}

const distance=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);

function hash2(x,y){let n=Math.imul(x+9,0x45d9f3b)^Math.imul(y+17,0x27d4eb2d);n=(n^(n>>>16))>>>0;n=Math.imul(n,0x7feb352d);n^=n>>>15;return(n>>>0)/4294967295}
function terrain(x,y){if(x<0||y<0||x>=W||y>=H)return'void';if(x===13&&y===9)return'city';const river=Math.sin(y*.62+x*.23)*.9+Math.cos(x*.48+y*.22)*.6;if(x>1&&x<25&&Math.abs(y-(5.4+Math.sin(x*.43)*2.1))<.75)return'water';let n=hash2(x,y);return n<.13?'forest':n<.19?'hill':n<.24?'flowers':n<.3?'scrub':'grass'}

function runAction(action,data={}){const x=data.x===undefined?selected[0]:Number(data.x),y=data.y===undefined?selected[1]:Number(data.y);let need;switch(action){
 case'build':{const id=data.id;if(!CITY[id])return;const lv=s.buildings[id]||0;if(lv>=12){note('Maximum building level reached in this beta');return}if(id!=='keep'&&lv>=s.buildings.keep+2){note('Upgrade the Great Hall before improving this building further.');return}const cost=coinCost(CITY[id].base,lv);if(!pay(cost))return;queueTask({kind:'build',id,seconds:clamp(8+lv*4,8,70)});note('🏗️ Upgrading '+CITY[id].label);break}

function drawHUD(){const list=[['🌾','food'],['🪵','wood'],['⛰️','stone'],['🪙','gold'],['💎','crystal']];el('resourceBar').innerHTML=list.map(([ic,k])=>`<div class="res"><i>${ic}</i><span>${fmt(s.resources[k])}</span></div>`).join('');el('worldSubhead').textContent=`🏰 Power ${fmt(power())} · 🏳️ ${s.claimed.length} territories · ⭐ Level ${s.level}`;el('worldFooter').textContent=`💾 Local save • ${s.tasks.length} active jobs • 🧭 ${s.explored.length} explored tiles`;}
function navInit(){el('nav').innerHTML=NAV.map(([id,emoji,label])=>`<button class="navbutton ${id==='world'?'active':''}" data-tab="${id}" title="${label}" aria-label="${label}"><span class="emoji">${emoji}</span><small>${label}</small></button>`).join('');el('nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)openTab(b.dataset.tab)})}
const mkButton=(label,action,id,disabled=false,style='')=>`<button class="action ${style}" data-action="${action}" ${id?`data-id="${safe(id)}"`:''} ${disabled?'disabled':''}>${label}</button>`;
const heading=(label,desc)=>`<div class="herohead"><span class="big">${label.split(' ')[0]}</span><div><h3>${label.slice(label.indexOf(' ')+1)}</h3><p>${desc}</p></div></div>`;
const metric=(label,value)=>`<div class="metric"><b>${value}</b><small>${label}</small></div>`;
function card(title,icon,desc,extra,buttons){return `<article class="card"><div class="em">${icon}</div><h3>${title}</h3><small>${desc}</small><small>${extra||''}</small>${buttons||''}</article>`}

 if(!visible(x,y)){ctx.fillStyle='#122b22d8';ctx.fillRect(left,top,sz+1,sz+1);ctx.globalAlpha=.17;iconText('?',px,py,sz*.31,false);ctx.globalAlpha=1;continue}
 if(s.claimed.includes(k)){ctx.fillStyle=s.alliance?.flags?.includes(k)?'#e0aa4a33':'#d8d69d22';ctx.fillRect(left,top,sz,sz);ctx.lineWidth=2;ctx.strokeStyle=s.alliance?.flags?.includes(k)?'#f6d082':'#cae3a477';ctx.strokeRect(left+2,top+2,sz-4,sz-4)}
 const n=nodeAt(x,y);if(n){if(n.type==='capital'){ctx.fillStyle='#dec78c';polygon(px,py,sz*.42,6);ctx.fill();ctx.strokeStyle='#886d38';ctx.lineWidth=2;ctx.stroke();iconText(s.banner||'🏰',px,py,sz*.46)}else{ctx.fillStyle='#15362bbb';ctx.beginPath();ctx.arc(px,py,sz*.37,0,Math.PI*2);ctx.fill();iconText(n.icon,px,py,sz*.45);if(s.completed.includes(n.id)){ctx.fillStyle='#b5e6af';ctx.beginPath();ctx.arc(px+sz*.23,py-sz*.25,sz*.08,0,2*Math.PI);ctx.fill()}}}
 if(s.alliance?.flags?.includes(k))iconText('🚩',px+sz*.31,py-sz*.27,sz*.28);
 if(s.heroPos?.[0]===x&&s.heroPos?.[1]===y){ctx.fillStyle='#1d342c';ctx.beginPath();ctx.arc(px+sz*.29,py+sz*.26,sz*.19,0,Math.PI*2);ctx.fill();iconText(HEROES[s.activeHero]?.icon||'🦊',px+sz*.29,py+sz*.26,sz*.3)}
 if(selected[0]===x&&selected[1]===y){ctx.strokeStyle='#fff0b4';ctx.lineWidth=3;ctx.strokeRect(left+3,top+3,sz-6,sz-6);ctx.strokeStyle='#4639229e';ctx.lineWidth=1.5;ctx.strokeRect(left+6,top+6,sz-12,sz-12)}
}
// Tiny citizens walk around the player's capital. Decorative, not simulated player accounts.
if(visible(CENTER.x,CENTER.y)){
 const city=xyToScreen(CENTER.x,CENTER.y),phase=performance.now()/3700;
 for(let i=0;i<5;i++){
  const angle=phase*.5+i*Math.PI*2/5;
  const px=city.x+Math.cos(angle)*(sz*.77),py=city.y+Math.sin(angle)*(sz*.58);
  if(px<0||px>w||py<0||py>h)continue;
  ctx.fillStyle='#18392bd0';ctx.beginPath();ctx.ellipse(px+1,py+4,sz*.055,sz*.03,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=['#e7cc95','#b9d59a','#f3e6c3','#e1b9a8','#a8c9c5'][i];ctx.beginPath();ctx.arc(px,py,Math.max(2,sz*.06),0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#344d36';ctx.fillRect(px-2,py-1,4,Math.max(3,sz*.09));
 }
}
ctx.fillStyle='#1c3d2799';ctx.strokeStyle='#ddc7919b';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(w-91,h-38,84,28,7);ctx.fill();ctx.stroke();ctx.fillStyle='#fff0ca';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 11px system-ui';ctx.fillText(`ZOOM ${Math.round(camera.zoom*100)}%`,w-49,h-24);
}
function doFrame(timestamp){if(drawingDirty||timestamp-lastFrame>250){mapDraw();drawingDirty=false;lastFrame=timestamp}requestAnimationFrame(doFrame)}
function actionFromButton(button){const action=button.dataset.action,id=button.dataset.id;
if(action==='center'){camera.x=CENTER.x;camera.y=CENTER.y;drawingDirty=true;drawerClose();return}
if(action==='tabCity'){openTab('city');return}
if(action==='focus'){const [x,y]=id.split(',').map(Number);camera.x=x;camera.y=y;selectTile(x,y);drawerClose();return}
if(action==='profileSave'){runAction('profile',{name:el('profileName')?.value,city:el('profileCity')?.value});return}
if(action==='allianceFound'){runAction('allianceFound',{name:el('allianceName')?.value,tag:el('allianceTag')?.value});return}
if(action==='bannerIcon'){runAction('changeBanner',{icon:id});return}
if(action==='bannerColor'){runAction('changeBanner',{color:id});return}
runAction(action,{id});}
el('drawBody').addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(btn&&!btn.disabled)actionFromButton(btn)});
el('inspector').addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(btn&&!btn.disabled)actionFromButton(btn)});
el('profileQuick').addEventListener('click',()=>openTab('profile'));
el('closeDrawer').addEventListener('click',drawerClose);
el('drawer').addEventListener('click',e=>{if(e.target===el('drawer'))drawerClose()});
el('zoomIn').addEventListener('click',()=>{camera.zoom=clamp(camera.zoom*1.2,.75,2.2);drawingDirty=true});
el('zoomOut').addEventListener('click',()=>{camera.zoom=clamp(camera.zoom/1.2,.75,2.2);drawingDirty=true});
el('centerMap').addEventListener('click',()=>{camera.x=13;camera.y=9;drawingDirty=true});
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointerDown={id:e.pointerId,x:e.clientX,y:e.clientY,camX:camera.x,camY:camera.y,drag:false}});
canvas.addEventListener('pointermove',e=>{if(!pointerDown||e.pointerId!==pointerDown.id)return;const dx=e.clientX-pointerDown.x,dy=e.clientY-pointerDown.y;if(Math.hypot(dx,dy)>6)pointerDown.drag=true;if(pointerDown.drag){camera.x=clamp(pointerDown.camX-dx/(44*camera.zoom),0,W-1);camera.y=clamp(pointerDown.camY-dy/(44*camera.zoom),0,H-1);drawingDirty=true}});
canvas.addEventListener('pointerup',e=>{if(!pointerDown||e.pointerId!==pointerDown.id)return;const drag=pointerDown.drag;pointerDown=null;if(!drag){const rect=canvas.getBoundingClientRect();const pos=screenToXY(e.clientX-rect.left,e.clientY-rect.top);if(pos.x>=0&&pos.y>=0&&pos.x<W&&pos.y<H)selectTile(pos.x,pos.y)}});
canvas.addEventListener('pointercancel',()=>{pointerDown=null});
canvas.addEventListener('wheel',e=>{e.preventDefault();camera.zoom=clamp(camera.zoom*(e.deltaY>0?.9:1.1),.75,2.2);drawingDirty=true},{passive:false});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawerVisible)drawerClose();if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='+')camera.zoom=clamp(camera.zoom*1.15,.75,2.2);if(e.key==='-')camera.zoom=clamp(camera.zoom/1.15,.75,2.2);drawingDirty=true});
function hydrate(){const oldProfile=(()=>{try{return JSON.parse(localStorage.getItem('fieldkeep_v10_profile')||'null')}catch{return null}})();if(oldProfile&&s.name==='Ranger'&&typeof oldProfile.name==='string'&&oldProfile.name!=='Ranger')s.name=oldProfile.name.replace(/[<>]/g,'').slice(0,18);if(!s.alliance)note('🌍 A new kingdom awaits. Explore the frontier!');drawHUD();navInit();renderInspector();resize();requestAnimationFrame(doFrame);window.addEventListener('resize',resize);setInterval(tick,1000);setInterval(()=>{if(drawerVisible){el('drawBody').querySelectorAll('[data-remaining]').forEach(e=>e.textContent=Math.max(0,Math.ceil((Number(e.dataset.remaining)-Date.now())/1000))+'s')}},800);save();}
hydrate();
window.FieldkeepKingdomsTest={getState:()=>JSON.parse(JSON.stringify(s)),act:(action,p)=>runAction(action,p),select:(x,y)=>selectTile(x,y),openTab,completeJobs:()=>{for(const t of s.tasks)t.end=Date.now()-1;s.lastTick=Date.now()-1000;tickAt=0;tick()},view:()=>({tab,selected,camera})};
</script>
